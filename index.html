<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Thrusters Test 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #ffffff;
            font-weight: 300;
        }
        
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 5rem 2rem;
        }
        
        .hero {
            text-align: center;
            padding: 4rem 0;
            margin-bottom: 4rem;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
            letter-spacing: -0.03em;
        }
        
        .subtext {
            font-size: 1.2rem;
            color: #777777;
            margin-bottom: 0.75rem;
            font-weight: 300;
        }
        
        .status {
            font-size: 1rem;
            color: #aaaaaa;
            font-style: italic;
            font-weight: 300;
        }
        
        .contact {
            padding-top: 2rem;
        }
        
        .contact h2 {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 1rem;
            color: #333333;
            letter-spacing: 0.02em;
        }
        
        .contact p {
            font-size: 0.95rem;
            color: #666666;
            font-weight: 300;
        }
        
        .contact a {
            color: #5b7eea;
            text-decoration: none;
            transition: opacity 0.2s ease;
            font-weight: 300;
        }
        
        .contact a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        hr {
            border: 0;
            height: 1px;
            background: #f0f0f0;
            margin: 3rem 0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <section class="hero">
            <h1>Building a Ship</h1>
            <p class="subtext">More Info Below</p>
            <p class="status">soon</p>
        </section>
        
        <hr>
        
        <section class="contact">
            <h2>Contact</h2>
            <p>Email: <a href="mailto:contact@somezingfunky.com">contact@somezingfunky.com</a></p>
        </section>
    </div>

</body>
</html>
